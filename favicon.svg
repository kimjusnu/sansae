<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="김준수 포트폴리오">
  <defs>
    <linearGradient id="sky" x1="16" y1="0" x2="16" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="rim" x1="2" y1="0" x2="30" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f6fd1" stop-opacity="0"/>
      <stop offset=".3" stop-color="#7aa7ff"/>
      <stop offset=".5" stop-color="#f4f7ff"/>
      <stop offset=".68" stop-color="#ffd9c2"/>
      <stop offset="1" stop-color="#5b74c9" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile"><rect width="32" height="32" rx="8"/></clipPath>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#sky)"/>
  <g clip-path="url(#tile)">
    <!-- atmosphere glow: the rim again, wide and faint -->
    <circle cx="16" cy="44" r="25" fill="none" stroke="url(#rim)" stroke-width="6" stroke-opacity=".28"/>
    <!-- planet surface: a large circle whose top edge is the horizon -->
    <circle cx="16" cy="44" r="25" fill="#060a14"/>
    <circle cx="16" cy="44" r="25" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
  </g>
  <!-- four-point star -->
  <path d="M22 5.2c.3 2 1.3 3 3.3 3.3-2 .3-3 1.3-3.3 3.3-.3-2-1.3-3-3.3-3.3 2-.3 3-1.3 3.3-3.3Z" fill="#f4f7ff"/>
</svg>
