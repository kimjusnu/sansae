<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>og</title>
<link rel="stylesheet" href="assets/css/base.css">
<style>
  /* Build-time template for the social share images. Rendered headlessly and
     then deleted — it is not part of the site. */
  body { margin: 0; background: #fff; }

  .card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 56px;
    width: 1200px;
    height: 630px;
    padding: 0 84px;
    overflow: hidden;
    background:
      radial-gradient(circle at 78% 12%, rgba(49, 130, 246, 0.18), transparent 42%),
      radial-gradient(circle at 8% 82%, rgba(34, 211, 238, 0.14), transparent 38%),
      #f7faff;
  }

  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-bottom: 10px solid transparent;
    border-image: linear-gradient(90deg, #1d4ed8, #3182f6 55%, #22d3ee) 1;
  }

  .copy { flex: 1 1 auto; min-width: 0; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    height: 46px;
    padding: 0 22px;
    border: 1px solid rgba(37, 99, 235, 0.16);
    border-radius: 999px;
    color: #1d4ed8;
    font-size: 20px;
    font-weight: 650;
    letter-spacing: 0.04em;
    background: rgba(255, 255, 255, 0.8);
  }

  .badge span {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #18a874;
    box-shadow: 0 0 0 4px rgba(24, 168, 116, 0.18);
  }

  h1 {
    margin-top: 30px;
    color: #0f1b2d;
    font-size: 104px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.04em;
  }

  .role {
    margin-top: 22px;
    color: #2563eb;
    font-size: 40px;
    font-weight: 650;
    letter-spacing: -0.02em;
  }

  .lede {
    margin-top: 18px;
    color: #4f6078;
    font-size: 27px;
    font-weight: 500;
    line-height: 1.45;
  }

  .tags {
    display: flex;
    gap: 10px;
    margin-top: 38px;
    padding-top: 30px;
    border-top: 1px solid rgba(37, 99, 235, 0.14);
  }

  .tags li {
    padding: 9px 18px;
    border: 1px solid rgba(37, 99, 235, 0.14);
    border-radius: 999px;
    color: #4f6078;
    font-size: 21px;
    font-weight: 600;
    background: #fff;
  }

  .art {
    flex: none;
    width: 400px;
    height: 400px;
    position: relative;
  }

  .art::before {
    content: "";
    position: absolute;
    inset: -14%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, rgba(49, 130, 246, 0.26), rgba(34, 211, 238, 0.1) 46%, transparent 68%);
  }

  .art img { position: relative; width: 100%; height: 100%; object-fit: contain; }

  /* Square variant for KakaoTalk profile-style thumbnails */
  body.square .card { width: 800px; height: 800px; flex-direction: column; justify-content: center; text-align: center; gap: 24px; padding: 0 72px; }
  body.square .art { order: -1; width: 300px; height: 300px; }
  body.square h1 { font-size: 92px; }
  body.square .lede { display: none; }
  body.square .tags { justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="card">
    <div class="copy">
      <div class="badge"><span></span>새로운 팀과의 합류를 찾고 있습니다</div>
      <h1>김준수</h1>
      <p class="role">프론트엔드 · AI 엔지니어</p>
      <p class="lede">문제를 관찰하고, 배포되는 제품까지 만듭니다</p>
      <ul class="tags">
        <li>React</li><li>Next.js</li><li>TypeScript</li><li>LLM</li>
      </ul>
    </div>
    <div class="art">
      <img src="icons/icon-hero-product-build.png" alt="">
    </div>
  </div>
</body>
</html>
